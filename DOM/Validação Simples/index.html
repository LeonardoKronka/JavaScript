<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação Simples</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="login-card">
        <h2>Acesso ao Sistema</h2>
        
        <input type="text" id="e-mail" placeholder="Digite seu e-mail">
        
        <div class="senha-container">
            <input type="password" id="senha" placeholder="Digite sua senha">
            <i id="botaoSenha" class="bi bi-eye-fill" title="Mostrar senha"></i>
        </div>
        
        <p id="mensagem-senha"></p>
        
        <button type="button" id="botao-validar">Entrar</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
