<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2>Cadastro de Usuário</h2>
    <div>
        <form>

            Nome: <input type="text" id="nome"><br><br>

            Email: <input type="text" id="email"><br><br>

            Senha: <input type="password" id="senha"><br><br>

            Endereço: <input type="text" id="endereco"><br><br>

            Telefone: <input type="text" id="telefone"><br><br>

            <button type="button" id="cadastrar">Cadastrar</button>

            <p id="mensagem"></p>

        </form>

    </div>

    <script src="script.js"></script>

</body>

</html>
