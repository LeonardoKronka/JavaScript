<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

    <div class="form-container">
        <h2>Cadastro de Usuário</h2>
        <form>
            
            <div class="input-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Digite seu nome">
            </div>

            <div class="input-group">
                <label for="email">Email:</label>
                <input type="text" id="email" placeholder="Digite seu email">
            </div>

            <div class="input-group">
                <label for="senha">Senha:</label>
                <div class="senha-container input-com-icone">
                    <input type="password" id="senha" placeholder="Digite sua senha">
                    <i id="botaoSenha" class="bi bi-eye-fill" title="Mostrar senha"></i>
                </div>
                <p id="mensagem_senha"></p>
            </div>
            
            <div class="input-group">
                <label for="confirmarSenha">Confirme a Senha:</label>
                <div class="confirmar-senha-container input-com-icone">
                    <input type="password" id="confirmarSenha" placeholder="Confirme sua senha">
                    <i id="botaoConfirmarSenha" class="bi bi-eye-fill" title="Mostrar senha"></i>
                </div>
            </div>

            <div class="input-group">
                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco" placeholder="Digite seu endereço">
            </div>

            <div class="input-group">
                <label for="telefone">Telefone:</label>
                <div class="telefone-container input-com-botao">
                    <input type="text" id="telefone" placeholder="Digite seu telefone">
                    <button type="button" id="addnumero" class="btn-adicionar"><i class="bi bi-plus-lg"></i></button>
                </div>
                <ul id="lista-numeros"></ul>
            </div>

            <button type="button" id="cadastrar">Cadastrar</button>

            <p id="mensagem"></p>

        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
